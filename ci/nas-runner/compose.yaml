# Self-hosted GitHub Actions runner for the `test` job, for a Synology DS423+ (x86-64).
# Setup and the reasons behind each setting: ci/nas-runner/README.md.
services:
  runner:
    image: myoung34/github-runner:ubuntu-noble
    container_name: planner-ci-runner
    restart: unless-stopped
    # The smoke tests publish the planner containers on 127.0.0.1:18080/18081 of the NAS and
    # curl them from the job, so the runner shares the NAS network.
    network_mode: host
    environment:
      REPO_URL: https://github.com/reinder83/satisfactory-planner
      RUNNER_SCOPE: repo
      # One-time registration token from Settings > Actions > Runners > New self-hosted runner.
      # It expires after an hour but is only needed for the first start: the registration is
      # kept in ./config, so this line can be emptied afterwards.
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      RUNNER_NAME: ds423-planner
      RANDOM_RUNNER_SUFFIX: 'false'
      LABELS: nas
      CONFIGURED_ACTIONS_RUNNER_FILES_DIR: /runner-config
      DISABLE_AUTOMATIC_DEREGISTRATION: 'true'
      # The jobs start containers through the NAS's Docker daemon, which resolves bind-mount
      # paths on the NAS itself: the work directory must have the same path on both sides.
      RUNNER_WORKDIR: /volume1/docker/github-runner/work
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /volume1/docker/github-runner/work:/volume1/docker/github-runner/work
      - /volume1/docker/github-runner/config:/runner-config
