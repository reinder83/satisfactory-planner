<svg xmlns="http://www.w3.org/2000/svg" width="960" height="8" viewBox="0 0 960 8" role="img" aria-labelledby="divider-title">
  <title id="divider-title">Hazard stripe divider</title>
  <defs>
    <pattern id="hazard" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="16" fill="#f89c1c"/>
      <rect x="8" width="8" height="16" fill="#15181a"/>
    </pattern>
  </defs>
  <rect width="960" height="8" fill="url(#hazard)"/>
</svg>
