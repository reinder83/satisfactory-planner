name: Test and publish Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: npm run check
      - run: npm test
      - name: Build and smoke-test the Docker container
        run: |
          docker build -t planner-smoke .
          docker run -d --name planner-smoke -p 127.0.0.1:18080:8080 -v planner-smoke-data:/data planner-smoke
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:18080/
          curl --fail -H 'Content-Type: application/json' -H 'X-Planner-Request: 1' -d '{"type":"check","key":"docker-smoke","value":true}' http://127.0.0.1:18080/api/update
          docker restart planner-smoke
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18080/health; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18080/api/state | node -e "let s='';process.stdin.on('data',c=>s+=c);process.stdin.on('end',()=>{if(JSON.parse(s).checks['docker-smoke']!==true)process.exit(1)})"
          curl --fail --silent -H 'Content-Type: application/json' -H 'X-Planner-Request: 1' -d '{"settings":{"recipes":"all","pureIngots":true,"nuclear":"recycle"}}' http://127.0.0.1:18080/api/preview | node -e "let s='';process.stdin.on('data',c=>s+=c);process.stdin.on('end',()=>{if(!JSON.parse(s).stages['5'].feasible)process.exit(1)})"
      - name: Test Synology IDs and root-owned bind-mount migration
        run: |
          mkdir -p "$RUNNER_TEMP/planner-nas"
          docker run --rm -v "$RUNNER_TEMP/planner-nas:/data" planner-smoke node --input-type=module -e "import fs from 'node:fs';import {initialState} from './server.mjs';const s=initialState();s.checks['nas-migration']=true;fs.writeFileSync('/data/progress.json',JSON.stringify(s),{mode:0o600});fs.chownSync('/data',0,0);fs.chmodSync('/data',0o700);"
          docker run -d --name planner-nas --cap-drop ALL --cap-add CHOWN --cap-add DAC_OVERRIDE --cap-add FOWNER --cap-add SETUID --cap-add SETGID --security-opt no-new-privileges:true -e PUID=1028 -e PGID=100 -e TZ=Europe/Amsterdam -p 127.0.0.1:18081:8080 -v "$RUNNER_TEMP/planner-nas:/data" planner-smoke
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18081/health; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18081/api/state | node -e "let s='';process.stdin.on('data',c=>s+=c);process.stdin.on('end',()=>{if(JSON.parse(s).checks['nas-migration']!==true)process.exit(1)})"
          docker exec planner-nas node -e "const fs=require('fs');const s=fs.readFileSync('/proc/1/status','utf8');if(!/^Uid:\\s+1028\\s+1028/m.test(s)||!/^Gid:\\s+100\\s+100/m.test(s))process.exit(1);const f=fs.statSync('/data/workspace.json');if(f.uid!==1028||f.gid!==100)process.exit(1);"
          docker stop planner-nas
          docker rm planner-nas
          docker run -d --name planner-nas --user 1028:100 -e PUID=1028 -e PGID=100 -p 127.0.0.1:18081:8080 -v "$RUNNER_TEMP/planner-nas:/data" planner-smoke
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:18081/health; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:18081/api/state | node -e "let s='';process.stdin.on('data',c=>s+=c);process.stdin.on('end',()=>{if(JSON.parse(s).checks['nas-migration']!==true)process.exit(1)})"
          if docker run --rm -e PUID=invalid planner-smoke; then exit 1; fi
      - name: Container diagnostics
        if: failure()
        run: |
          docker logs planner-smoke || true
          docker logs planner-nas || true
      - name: Clean up smoke test
        if: always()
        run: |
          docker rm -f planner-nas || true
          docker rm -f planner-smoke || true
          docker volume rm planner-smoke-data || true

  publish:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=ref,event=tag
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
